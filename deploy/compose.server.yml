# 公网部署用的 compose 模板：应用只绑 127.0.0.1，公网入口交给宿主机上已有的反向代理。
#
# 为什么不让这个 compose 自己带 Caddy/Nginx：目标服务器上 80/443 已经被 1Panel 的 OpenResty 占了，
# 再起一个反代只会抢端口。正确做法是把这个容器挂在本机端口上，由既有反代转发过来。
#
# 用法（把下面的 <...> 换成实际值）：
#   cp deploy/compose.server.yml /opt/xianyu-monitor/docker-compose.yml
#   # 然后按 deploy/README-部署.md 准备 config.json 与 .env
#   docker compose up -d
#
# 注意 config.json 里必须设：
#   "web": { "host": "0.0.0.0", "password": "${WEB_PASSWORD}", "trustProxy": true, "open": false }
#   - host 0.0.0.0 是因为容器内的进程要监听所有网卡，再由 Docker 映射到宿主机的 127.0.0.1
#   - trustProxy true 才能按真实访客 IP 限流、并认 X-Forwarded-Proto 给 Cookie 加 Secure
services:
  xianyu-monitor:
    # 二选一：
    #   1) 拉已发布的镜像（推荐）：打 tag 后 CI 推到 GHCR，服务器上 pull 就行，不必留源码
    #   2) 本地构建：注释掉 image:，改用 build: .
    image: ghcr.io/timefunnel/xianyu-monitor:latest
    # build: .
    container_name: xianyu-monitor
    restart: unless-stopped
    # 跑控制台（它会自动拉起监控）。只要监控、不要界面就换成 run。
    # --no-open 是必须的：容器里没有桌面，别去调 xdg-open。
    command: ["node", "src/cli.mjs", "web", "--no-open"]
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      XIANYU_CONFIG: /app/conf/config.json
    volumes:
      # 挂**目录**而不是单个文件。单文件挂载会踩两个坑（都实测过）：
      #  1) 挂载点无法被 rename 覆盖 → 保存配置报 EBUSY: rename '/app/conf/config.json.tmp' ...
      #  2) 用 1Panel / 宿主机编辑器改过 config.json 后它会被 root 重建，容器(uid 1000) 直接写就 EACCES
      # 挂目录后原子替换只需**目录**可写，这两种情况都不会再出现（root 重建的文件也能被替换掉）。
      # 首次部署：mkdir -p conf data && cp config.example.json conf/config.json \
      #           && sudo chown -R 1000:1000 conf data
      #
      # ⚠️ 配套要求：`storage.stateFile` 请写成**容器内绝对路径** `/app/data/state.json`。
      # 相对路径是按**配置文件所在目录**解析的，配置挪进 conf/ 之后 "./data/state.json"
      # 会变成 /app/conf/data/ —— 数据跑到另一个目录，控制台的命中历史会看起来是空的。
      - ./conf:/app/conf
      - ./data:/app/data
    # 只绑本机：公网入口交给宿主机上的 OpenResty（1Panel），容器不直接暴露。
    ports:
      - "127.0.0.1:7788:7788"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
