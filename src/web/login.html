<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>闲鱼监控 · 登录</title>
<style>
  :root {
    --bg: #1c1c1e;
    --surface: #2c2c2e;
    --border: rgba(255, 255, 255, .12);
    --text: #f2f2f7;
    --muted: #9a9aa2;
    --primary: #0a84ff;
    --red: #ff453a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
  }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; }
  label { display: block; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
  input[type=password] {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }
  input[type=password]:focus { border-color: var(--primary); }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 11px 12px;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    background: var(--primary);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    margin: 0 0 16px;
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--red);
    background: color-mix(in srgb, var(--red) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
    border-radius: 8px;
  }
  .tip { margin: 18px 0 0; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <h1>闲鱼监控</h1>
    <p class="sub">请输入访问密码</p>
    {{ERROR}}
    <form method="post" action="/login">
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button type="submit">进入控制台</button>
    </form>
    <p class="tip">自用监控控制台。多次输错会被暂时锁定。</p>
  </main>
</body>
</html>
