services:
  xianyu-monitor:
    build: .
    container_name: xianyu-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 通知里的时间按这个时区显示；宿主机是 UTC 时不设会看到差 8 小时的时间戳。
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 挂**目录**而不是单个文件，这条最重要：
      #  - 单文件挂载的挂载点无法被 rename 覆盖 → 保存配置报 EBUSY
      #  - 用 1Panel / 宿主机编辑器改过 config.json 后，它会被 root 重建，容器(uid 1000) 直接写就 EACCES
      # 挂目录后，原子替换（写临时文件再改名）只需要**目录**可写，上面两种情况都不会再出现。
      # 首次部署前：mkdir -p conf data && cp config.example.json conf/config.json \
      #             && sudo chown -R 1000:1000 conf data
      - ./conf:/app/conf
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 想用图形控制台就取消注释，并把 command 换成 web（记得在 config.json 里设 web.password）
    # ports:
    #   - "127.0.0.1:7788:7788"
    # command: ["node", "src/cli.mjs", "web", "--no-open"]

# 常用操作：
#   首次登录（二维码直接打在容器终端里，用闲鱼 App 扫屏幕）：
#     docker compose run --rm xianyu-monitor node src/cli.mjs login
#   校验配置：
#     docker compose run --rm xianyu-monitor node src/cli.mjs check
#   测试通知渠道：
#     docker compose run --rm xianyu-monitor node src/cli.mjs test-notify
#   看日志：
#     docker compose logs -f
